name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "routine-mate-android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: routine-mate-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and check APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RoutineMate-APK
          path: routine-mate-android/app/build/outputs/apk/debug/app-debug.apk
